services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  platform:
    build: .
    image: trading-platform:latest
    command: ["uv", "run", "python", "main.py"]
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://trading:trading@postgres/trading
      DASHBOARD_HOST: "0.0.0.0"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /api/ping only responds once the dashboard API server is up, which
      # main.py only starts after _run_migrations() + _sync_instruments()
      # both complete.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/ping', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  dashboard-ui:
    build:
      context: ../trading-dashboard
      args:
        VITE_API_URL: http://platform:8081
    environment:
      VITE_API_URL: http://platform:8081
    ports:
      - "3000:3000"
    depends_on:
      platform:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
