services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    ports:
      - "9092:9092"
      # PLAINTEXT_HOST listener below advertises "localhost:29092" for
      # non-Docker clients (e.g. `uv run start` on the host) — must be
      # published or those clients get metadata pointing at the
      # Docker-internal "kafka" hostname, which they can't resolve.
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  ingestor:
    build: .
    command: ["uv", "run", "python", "main.py", "ingestor"]
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://trading:trading@postgres/trading
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER_URL: kafka://kafka:9092
      DASHBOARD_HOST: "0.0.0.0"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  worker-rsi:
    build: .
    command: ["uv", "run", "python", "main.py", "worker", "--algo", "rsi_mean_reversion"]
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://trading:trading@postgres/trading
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER_URL: kafka://kafka:9092
      # Paper-trading postback target: workers run in their own container,
      # so the pydantic default of 127.0.0.1 would point at themselves, not
      # the ingestor container that actually serves /api/postback.
      DASHBOARD_HOST: "ingestor"
    depends_on:
      ingestor:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  worker-linreg:
    build: .
    command: ["uv", "run", "python", "main.py", "worker", "--algo", "linreg_trend"]
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://trading:trading@postgres/trading
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER_URL: kafka://kafka:9092
      DASHBOARD_HOST: "ingestor"
    depends_on:
      ingestor:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  worker-dpo:
    build: .
    command: ["uv", "run", "python", "main.py", "worker", "--algo", "dpo_mean_reversion"]
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://trading:trading@postgres/trading
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER_URL: kafka://kafka:9092
      DASHBOARD_HOST: "ingestor"
    depends_on:
      ingestor:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  worker-squeeze:
    build: .
    command: ["uv", "run", "python", "main.py", "worker", "--algo", "squeeze_breakout"]
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://trading:trading@postgres/trading
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER_URL: kafka://kafka:9092
      DASHBOARD_HOST: "ingestor"
    depends_on:
      ingestor:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  dashboard-ui:
    build:
      context: ../trading-dashboard
      args:
        VITE_API_URL: http://ingestor:8081
    environment:
      VITE_API_URL: http://ingestor:8081
    ports:
      - "3000:3000"
    depends_on:
      ingestor:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
